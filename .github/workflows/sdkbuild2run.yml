name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    env:
      CellsCloudClientId: ${{ secrets.PRODUCTCLIENTID }}
      CellsCloudClientSecret: ${{ secrets.PRODUCTCLIENTSECRET }}
      CellsCloudApiBaseUrl: https://api.aspose.cloud

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install SDK
      run: mvn -B install -DskipTests --file pom.xml

    - name: Compile Examples
      run: mvn -B -q compile --file examples/pom.xml

    - name: Run Examples
      shell: pwsh
      run: |
        # Run every example in the examples directory. The cloud-backed
        # examples create and mutate files under the JavaSDK folder.
        $all = Get-ChildItem -Path examples -Filter *.java | ForEach-Object { $_.BaseName }
        # These two prepare JavaSDK and JavaSDK/Output, which the other cloud
        # examples use, so run them first.
        $preferred = @("CloudStorageManagementExample", "SplitExcelFilesExample")
        $examples = @($preferred | Where-Object { $all -contains $_ }) +
                    @($all | Where-Object { $preferred -notcontains $_ } | Sort-Object)

        $failed = @()
        foreach ($name in $examples) {
          Write-Host "`n--- $name ---" -ForegroundColor Cyan
          mvn -B -q exec:exec --file examples/pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.$name"

          if ($LASTEXITCODE -ne 0) {
            Write-Host "FAILED: $name" -ForegroundColor Red
            $failed += $name
          }
        }

        if ($failed.Count -gt 0) {
          Write-Error ("Examples failed: " + ($failed -join ", "))
          exit 1
        }

        Write-Host "`nAll examples completed." -ForegroundColor Green