name: Java CI with Maven

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: windows-latest
    env:
      CellsCloudClientId: ${{ secrets.PRODUCTCLIENTID }}
      CellsCloudClientSecret: ${{ secrets.PRODUCTCLIENTSECRET }}
      CellsCloudApiBaseUrl: https://api.aspose.cloud

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # - name: Install SDK
      #   run: mvn -B install -DskipTests --file pom.xml

      # - name: Compile Examples
      #   run: mvn -B -q compile --file Examples/pom.xml

      - name: Run Examples
        shell: pwsh
        run: |
          mvn -B install -DskipTests --file pom.xml
          Set-Location Examples\
          Write-Host "Excute Examples"
          mvn -B -q compile --file ./pom.xml
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.BatchProcessingExample"
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.CloudStorageManagementExample"
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.ConvertExcelExample"
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.CreateReportFilesExample"
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.ExcelSplitExample"
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.ManagementExample"
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.MergeExcelFilesExample"
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.ProtectionExample"
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.QuickStartExample"
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.SplitExcelFilesExample"
          mvn -B -q exec:exec --file ./pom.xml "-Dexample.mainClass=com.aspose.cells.cloud.examples.TextProcessingExample"
          Write-Host "`nAll examples completed." -ForegroundColor Green
